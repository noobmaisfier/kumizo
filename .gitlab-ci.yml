# ---------------------------------------------------------------------------
# CI suspendue jusqu'à nouvel ordre (22 oct. 2026)
# Aucune pipeline ne se crée : push main, tags, MR — tout est bloqué.
# Réactivation : supprimer ce bloc `workflow`, ou définir la variable de
# projet KUMIZO_CI=on (Paramètres > CI/CD > Variables).
# Côté GitHub, le workflow `ci` est désactivé (gh workflow disable ci).
#
# Une seule tâche : `check`. Aucun binaire n'est construit ni publié :
# l'installation passe uniquement par crates.io
# (`cargo install --locked kumizo-aurora kumizo`).
# ---------------------------------------------------------------------------
workflow:
  rules:
    - if: '$KUMIZO_CI == "on"'

stages:
  - test

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  RUST_BACKTRACE: "1"

default:
  image: rust:latest
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .cargo/bin
      - .cargo/registry/index
      - .cargo/registry/cache
      - target/

# ---------------------------------------------------------------------------
# Stage: Test & Lint
# ---------------------------------------------------------------------------
check:
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -y -qq pkg-config libpam0g-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libasound2-dev
  script:
    - cargo check --workspace
    - cargo test --workspace --lib
