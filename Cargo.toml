[workspace]
members = [
    "crates/kumizo-kit",
    "crates/wk-gpui-ext",
    "crates/wk-services",
    "crates/wk-compositor",
    "crates/wk-ipc",
    "crates/wk-ui",
    "crates/wk-pam",
    "crates/wk-ctl",
    "examples/shell",
    "examples/kiln",
    "examples/aurora",
    "examples/sources",
    "examples/lockscreen",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["WidgetKit Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/widgetkit/widgetkit"
readme = "README.md"
keywords = ["wayland", "gpui", "status-bar", "desktop", "widgets"]
categories = ["gui", "os::unix-apis"]

[workspace.dependencies]
# GPUI engine, pinned to an exact crates.io snapshot (`gpui-pre`) published by
# the GPUI Kit project. It is a snapshot of Zed's upstream `gpui` (same code,
# Apache-2.0, notices intact) republished under a semver version, so the pin is
# explicit and no longer relies on the git `main` branch + Cargo.lock alone.
# `package = "gpui-pre"` keeps the import name `gpui`.
# RULE: exactly ONE `gpui-pre` version in the whole dependency graph. Anything
# downstream (e.g. `gpui-kit`) MUST resolve to this same snapshot, otherwise
# Cargo compiles two GPUI copies and their types stop being interchangeable.
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = true }

# Platform bootstrap. GPUI no longer exposes `Application::new()`, so an
# `Application` has to be built from a concrete `Platform`; `gpui_platform` is
# the convenience crate that provides `application()` for the host OS.
# Same snapshot as `gpui` above, so both resolve to the same commit.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", default-features = false, features = [
    "font-kit",
    "wayland",
    "x11",
] }

# Asynchronous runtime and D-Bus integration
zbus = { version = "4.4", default-features = false, features = ["async-io"] }
async-io = "2.3"
async-channel = "2.3"
futures-lite = "2.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Serialization & IPC
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Audio tags (aurora music player)
lofty = "0.25"

# Error handling and utilities
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
bitflags = "2.6"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
libc = "0.2"

# Raw pixel decoding (tray icons) and small-vector storage for image frames.
# `image` is decode-only PNG here; gpui already enables the format, so no new
# native dependencies are pulled in.
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1"
wk-ui = { path = "crates/wk-ui" }
wk-gpui-ext = { path = "crates/wk-gpui-ext" }
wk-services = { path = "crates/wk-services" }
wk-compositor = { path = "crates/wk-compositor" }
wk-ipc = { path = "crates/wk-ipc" }
