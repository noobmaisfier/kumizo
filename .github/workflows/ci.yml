# Équivalent GitHub Actions de .gitlab-ci.yml.
#
# Une seule tâche : `check` (vérifie + teste le workspace sur push main et PR).
#
# Aucun binaire n'est construit ni publié : l'installation passe uniquement par
# crates.io (`cargo install --locked kumizo-aurora kumizo`).
#
# Les minutes Actions sont gratuites (2000 min/mois sur les dépôts publics).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_HOME: ${{ github.workspace }}/.cargo
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Test & Lint
  # ---------------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq pkg-config libpam0g-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libasound2-dev
      - uses: actions/cache@v4
        with:
          path: |
            .cargo/registry
            .cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo check --workspace
      - run: cargo test --workspace --lib
