# ─────────────────────────────────────────────────────────────────────────────
# This manifest is DELIBERATELY standalone.
#
# Aurora is an *example*: you must be able to copy this folder anywhere
# (`cp -r aurora ~/my-shell`) and run `cargo build` without anything else from
# the repository. So NO workspace inheritance here (`version.workspace = true`,
# `workspace = true`, `../kumizo-kit` path…): everything is written explicitly.
#
# The local `kumizo-kit` is used *only* inside this repository, via the
# `[patch]` in the root Cargo.toml. A copy taken out of the repository pulls
# `kumizo-kit` from crates.io. In return: keep `version` aligned with
# `[workspace.package]`.
# ─────────────────────────────────────────────────────────────────────────────

[package]
name = "kumizo-aurora"
version = "0.12.1"
edition = "2021"
authors = ["Kumizo Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/noobmaisfier/kumizo"
readme = "README.md"
description = "Aurora shell: floating bar, control center, launcher, tasks, power, notifs, toasts, OSD, pomodoro"
keywords = ["wayland", "shell", "status-bar", "gpui"]
categories = ["gui"]

[[bin]]
name = "aurora"
path = "src/main.rs"

[[bin]]
name = "aurora-lockscreen"
path = "src/lockscreen.rs"

[dependencies]
kumizo-kit = { version = "0.12.1", default-features = false, features = ["app", "layer-shell"] }
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = true }
async-io = "2.3"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
smallvec = "1"
# No audio engine here: the shell only reads MPRIS media (browser,
# external player…). A local player lives in its own process and publishes
# itself via MPRIS — keeping the shell MIT OR Apache-2.0.
