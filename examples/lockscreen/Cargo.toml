[package]
name = "lockscreen-example"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Fullscreen PAM lockscreen running as a separate locker process"

[[bin]]
name = "lockscreen"
path = "src/main.rs"

[dependencies]
kumizo-kit = { path = "../../crates/kumizo-kit" }
gpui = { workspace = true }
async-io = { workspace = true }
smallvec = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
wk-pam = { path = "../../crates/wk-pam" }
