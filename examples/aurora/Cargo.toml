[package]
name = "aurora"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Aurora shell: floating bar, control center, launcher, tasks, power, notifs, toasts, OSD, pomodoro"

[[bin]]
name = "aurora"
path = "src/main.rs"

[[bin]]
name = "aurora-lockscreen"
path = "src/lockscreen.rs"

[dependencies]
widgetkit = { path = "../../crates/widgetkit" }
gpui = { workspace = true }
async-io = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
lofty = { workspace = true }
resvg = "0.46.0"
image = { workspace = true }
smallvec = { workspace = true }
# Moteur audio : rockbox-playback 0.7 (codecs C via `cc`, sortie cpal).
# SANS les features `http` par défaut (reqwest/tokio) : le lecteur reste 100 %
# local, aucun accès réseau.
# NOTE LICENCE : cette crate est GPL-2.0-or-later ; le binaire `aurora` lié
# avec elle tombe sous GPL-2.0-or-later (le workspace reste MIT OR Apache-2.0
# pour son propre code). À prendre en compte avant toute distribution.
rockbox-playback = { version = "0.7", default-features = false, features = ["cpal"] }
