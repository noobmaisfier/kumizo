<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 32 336 336" width="100%" height="100%">
  <!-- Bloc disque complet (l'équivalent du groupe #vinyl-disc de la démo :
       corps, sillons, reflets, label, axe). Tourne en bloc en lecture.
       {ACCENT} {ACCENT2} injectés depuis le thème, {DEG} = angle autour du
       centre (180, 200) — voir music/disc.rs. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <radialGradient id="vinyl-base" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a3a3a" />
      <stop offset="25%" stop-color="#141414" />
      <stop offset="60%" stop-color="#2a2a2a" />
      <stop offset="85%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <linearGradient id="label-style" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{ACCENT}" />
      <stop offset="100%" stop-color="{ACCENT2}" />
    </linearGradient>

    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>

    <path id="label-text-path" d="M 180, 200 m -50, 0 a 50,50 0 1,1 100,0 a 50,50 0 1,1 -100,0" />
  </defs>

  <g transform="rotate({DEG} 180 200)">
    <!-- Corps -->
    <circle cx="180" cy="200" r="168" fill="url(#vinyl-base)" filter="url(#shadow)" />

    <circle cx="180" cy="200" r="167" fill="none" stroke="#111111" stroke-width="1.5" />
    <circle cx="180" cy="200" r="166.5" fill="none" stroke="#444444" stroke-width="0.5" />

    <!-- Sillons -->
    <g stroke="#111111" stroke-width="0.8" fill="none" opacity="0.85">
      <circle cx="180" cy="200" r="156" />
      <circle cx="180" cy="200" r="152" />
      <circle cx="180" cy="200" r="148" stroke-width="1.5" />
      <circle cx="180" cy="200" r="144" />
      <circle cx="180" cy="200" r="140" />
      <circle cx="180" cy="200" r="136" />
      <circle cx="180" cy="200" r="131" />
      <circle cx="180" cy="200" r="126" stroke-width="2" />
      <circle cx="180" cy="200" r="122" />
      <circle cx="180" cy="200" r="118" />
      <circle cx="180" cy="200" r="113" />
      <circle cx="180" cy="200" r="108" stroke-width="1.8" />
      <circle cx="180" cy="200" r="104" />
      <circle cx="180" cy="200" r="100" />
      <circle cx="180" cy="200" r="95" />
      <circle cx="180" cy="200" r="91" />
    </g>

    <!-- Reflets -->
    <path d="M 180 200 L 299 80 A 168 168 0 0 1 345 230 Z" fill="#ffffff" opacity="0.05" />
    <path d="M 180 200 L 61 320 A 168 168 0 0 1 15 170 Z" fill="#ffffff" opacity="0.05" />

    <path d="M 180 200 L 230 359 A 168 168 0 0 1 70 326 Z" fill="#ffffff" opacity="0.03" />
    <path d="M 180 200 L 130 41 A 168 168 0 0 1 290 74 Z" fill="#ffffff" opacity="0.03" />

    <!-- Label -->
    <circle cx="180" cy="200" r="68" fill="url(#label-style)" />
    <circle cx="180" cy="200" r="65" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.8" />
    <circle cx="180" cy="200" r="62" fill="none" stroke="#ffffff" stroke-dasharray="3, 3" stroke-width="0.8" opacity="0.4" />

    <text font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" letter-spacing="1.5" opacity="0.85">
      <textPath href="#label-text-path" startOffset="50%" text-anchor="middle">
        ORIGINAL SOUND • 33 RPM • ORIGINAL SOUND
      </textPath>
    </text>

    <circle cx="180" cy="200" r="28" fill="#151515" opacity="0.2" />
    <path d="M 162 195 L 198 195 M 165 200 L 195 200 M 172 205 L 188 205" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
    <text x="180" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">VINYL</text>
    <text x="180" y="217" font-family="'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="bold" fill="#ffa751" text-anchor="middle" letter-spacing="1">HI-FI STEREO</text>

    <!-- Axe central -->
    <circle cx="180" cy="200" r="11" fill="none" stroke="#111" stroke-width="1.5" />
    <circle cx="180" cy="200" r="9" fill="#2d2d2d" />
    <circle cx="180" cy="200" r="5" fill="#1a1a1a" />
    <circle cx="180" cy="200" r="3.5" fill="#c8c8c8" />
    <circle cx="179" cy="199" r="1" fill="#ffffff" opacity="0.8" />
  </g>

</svg>
