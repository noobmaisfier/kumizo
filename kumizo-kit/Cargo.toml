[package]
name = "kumizo-kit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance, pure-Rust, GPU-accelerated Wayland desktop shell SDK"
keywords.workspace = true
categories.workspace = true

[dependencies]
gpui = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
async-channel = { workspace = true, optional = true }

zbus = { workspace = true, optional = true }
async-io = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

thiserror = { workspace = true, optional = true }
log = { workspace = true, optional = true }
bitflags = { workspace = true, optional = true }
time = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

image = { workspace = true, optional = true }
smallvec = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }

[features]
default = ["app", "layer-shell"]
# Everything: builder, registry, animation, services, compositor, layer-shell.
full = ["app", "layer-shell"]

# `Kumizo` builder, service registry, window animation and the prelude.
app = [
    "dep:gpui",
    "dep:gpui_platform",
    "ext",
    "ui",
    "ipc",
    "services",
    "compositor",
    "dep:anyhow",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:async-channel",
]

# UNIX socket protocol, client, server and `WindowControl`.
ipc = [
    "dep:serde",
    "dep:serde_json",
    "dep:anyhow",
    "dep:async-io",
    "dep:async-channel",
    "dep:thiserror",
    "dep:tracing",
    "dep:libc",
]

# `wlr-layer-shell` wrappers (anchor, margins, layer window).
ext = ["dep:gpui", "dep:anyhow", "dep:bitflags"]

# Headless UI primitives (text input and actions).
ui = ["dep:gpui"]

# Long-lived async services: clock, battery, audio, MPRIS, network, tray…
services = [
    "ipc",
    "dep:gpui",
    "dep:zbus",
    "dep:async-io",
    "dep:async-channel",
    "dep:futures-lite",
    "dep:futures-util",
    "dep:serde",
    "dep:time",
    "dep:thiserror",
    "dep:tracing",
    "dep:log",
    "dep:libc",
    "dep:image",
    "dep:smallvec",
    "dep:resvg",
]

# Sway / Hyprland / Niri IPC integrations.
compositor = [
    "services",
    "dep:gpui",
    "dep:anyhow",
    "dep:async-io",
    "dep:async-channel",
    "dep:serde",
    "dep:serde_json",
    "dep:tracing",
    "dep:thiserror",
]

# Minimal Linux-PAM password check (`pam::verify`).
pam = ["dep:libc"]

# Create real `wlr-layer-shell` surfaces so anchors, exclusive zone and margins
# are honoured by the compositor. Requires Linux + Wayland; elsewhere (and with
# `--no-default-features`) windows fall back to `WindowKind::PopUp`.
layer-shell = ["layer-shell-variant"]
layer-shell-variant = []
